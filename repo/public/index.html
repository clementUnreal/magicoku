<html lang="fr">
<head>

<meta name="theme-color" content="#1a1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" href="favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-user-select:none;user-select:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}textarea,input{-webkit-user-select:text;user-select:text}</style>

<body>
<title>Magicoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800;900&family=Nunito:wght@400;600;800;900&family=Gochi+Hand&family=Oswald:wght@500;600&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: trois colonnes comme un plateau de jeu (suspects | plan | outils) ; sur téléphone le plan passe en haut, outils et suspects dessous. Look unique, couleurs toutes explicites. */
:root{
  --page:#efe0c4; --paper:#fbf4e4; --ink:#2b1a33; --soft:#7d6672; --line:#dcc6a6;
  --wall:#3a2547; --cherry:#b8283e; --cherry-soft:#f6dcd2; --sel:#3b7be0; --sel-soft:#dbe8fb; --gold:#e8b93a; --gold-soft:#fbefc8;
  --f-display:"Grandstander","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,sans-serif;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --f-label:"Oswald","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,250,235,.7),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(150,100,60,.18),transparent 55%);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:900 clamp(28px,4.4vw,42px)/.95 var(--f-display);margin:0;letter-spacing:-.5px}
h1 .drop{color:var(--cherry)}
.case-title{font:800 15px var(--f-body);color:var(--soft)}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:800 13px var(--f-display);border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab small{font:800 10px var(--f-body);color:var(--soft);margin-left:5px;text-transform:uppercase;letter-spacing:.06em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--page)}
.tab[aria-selected="true"] small{color:var(--page);opacity:.75}
.tab .ok{color:var(--cherry)}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font:800 12px var(--f-body)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.story{margin:0;font-size:15px}
.story b{color:var(--cherry)}
.game{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) 150px;gap:18px;align-items:start}
/* ---------- suspects ---------- */
.suspects h2,.tools h2{font:900 15px var(--f-display);text-align:center;margin:0}
.suspects .help{font-size:12px;color:var(--soft);text-align:center;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.card{display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer;text-align:center;min-width:0}
.polaroid{display:block;width:62%;background:#fff;border:3px solid var(--wall);border-radius:6px;padding:5px 5px 0;box-shadow:0 3px 0 var(--wall);position:relative;z-index:1;transition:transform .15s}
.polaroid .ph{display:block;aspect-ratio:1;border-radius:3px;overflow:hidden}
.polaroid .ph svg{width:100%;height:100%;display:block}
.polaroid .nm{display:block;font:400 19px/1.4 var(--f-hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clue{position:relative;margin-top:-6px;width:100%;min-height:76px;background:var(--paper);border:3px solid var(--wall);border-radius:12px;padding:12px 8px 8px;font-size:13.5px;line-height:1.3;display:flex;flex-direction:column;justify-content:center;gap:3px;box-shadow:0 3px 0 var(--wall)}
.clue b{font-weight:900}
.clue .none{color:var(--soft);font-style:italic}
.card.victim .clue{background:var(--cherry-soft)}
.card .vt{font:900 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--cherry)}
.card[aria-pressed="true"] .polaroid{border-color:var(--sel);box-shadow:0 0 0 4px var(--sel-soft),0 3px 0 var(--sel);transform:translateY(-3px)}
.card[aria-pressed="true"] .polaroid .nm{color:var(--sel)}
.card[aria-pressed="true"] .clue{border-color:var(--sel)}
.card.placed .polaroid,.card.placed .clue{opacity:.45}
.card:focus-visible{outline:3px solid var(--sel);outline-offset:3px;border-radius:12px}
/* ---------- board ---------- */
.center{display:flex;flex-direction:column;gap:8px;min-width:0}
.board{width:100%;max-width:700px;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.plan{position:relative;width:100%;aspect-ratio:1;touch-action:none}
.mapimg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.8) brightness(.9);pointer-events:none}
.layer{position:absolute;display:grid;inset:3.2%}
.cell{border:0;padding:0;margin:0;cursor:pointer;position:relative;min-width:0;min-height:0;box-shadow:inset 0 0 0 .7px rgba(40,20,20,.22)}
.cell.void{background:transparent;box-shadow:none;cursor:default}
.grid-shadow{}
.cell:focus-visible{outline:3px solid var(--sel);outline-offset:-4px;z-index:2}
.cell.blocked{cursor:default}
.obj{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.obj .med{position:absolute;height:72%;aspect-ratio:1;max-width:72%;border-radius:50%;background:radial-gradient(circle,rgba(255,248,230,.95) 0 60%,rgba(255,240,210,.85) 100%);box-shadow:0 0 0 2px #b8913a,0 3px 8px rgba(0,0,0,.45)}
.cell.solid .obj .med{box-shadow:0 0 0 2px #8f2f3c,0 3px 8px rgba(0,0,0,.45)}
.obj img{position:relative;max-width:56%;max-height:56%;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.marks{pointer-events:none}
.mk{position:relative;min-width:0;min-height:0}
.mk.hov{box-shadow:inset 0 0 0 3px var(--cherry)}
.mk.room{background:rgba(120,170,255,.2)}
.who{position:absolute;inset:-7%;z-index:5;animation:pop .25s ease-out;display:flex;align-items:center;justify-content:center}
.who .ph{position:relative;height:100%;aspect-ratio:1;max-width:100%;border-radius:12%;overflow:hidden;box-shadow:0 0 0 2.5px var(--wall),0 3px 0 2px rgba(42,24,48,.35)}
.who svg{width:100%;height:100%;display:block}
.who .ini{position:absolute;left:0;top:-8%;font:900 clamp(15px,3.4vw,26px)/1 var(--f-display);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mk.clash .who .ph{box-shadow:0 0 0 3px var(--cherry),0 0 10px 2px var(--cherry)}
.xm{position:absolute;inset:14%;display:flex;align-items:center;justify-content:center}
.xm svg{height:100%;aspect-ratio:1;max-width:100%;display:block;filter:drop-shadow(0 0 2px rgba(255,248,230,.9))}
.xm.auto{opacity:.85}
.xm.preview{opacity:.55}
.notes{position:absolute;inset:4%;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1px 3px;z-index:3}
.notes span{font:900 clamp(11px,2.4vw,19px)/1 var(--f-display);-webkit-text-stroke:2.5px #fff;paint-order:stroke fill}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.hold{position:absolute;inset:0;z-index:6;pointer-events:none;background:rgba(59,123,224,.0);animation:holdbg .5s linear forwards}
.hold::before{content:"";position:absolute;inset:0;padding:5px;border-radius:3px;background:conic-gradient(from -45deg,var(--sel) var(--a),rgba(59,123,224,.18) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ring .5s linear forwards}
@keyframes ring{to{--a:360deg}}
@keyframes holdbg{to{background:rgba(59,123,224,.3)}}
.mk.flash{animation:flash 1.1s ease-out 2}
@keyframes flash{50%{box-shadow:inset 0 0 0 4px var(--gold)}}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
.rlabel{position:absolute;transform:translate(-50%,-50%);font:600 clamp(8px,1.6vw,13px)/1 var(--f-label);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;
  background:#fbf2df;color:var(--wall);border:2px solid var(--wall);border-radius:999px;padding:2px 8px 3px;z-index:4;pointer-events:none;transition:background .15s,color .15s}
.rlabel.room{background:var(--sel);color:#fff;border-color:var(--sel)}
.edge{position:absolute;transform:translate(-50%,-50%);font:800 clamp(9px,1.6vw,13px)/1 var(--f-display);color:var(--soft);pointer-events:none;z-index:4}
.edge.top{top:-2.6%}
.edge.side{left:-2.4%}
.tip{position:absolute;transform:translate(-50%,-100%);background:var(--wall);color:#fff;font:800 11px var(--f-body);padding:2px 7px;border-radius:6px;pointer-events:none;z-index:7;white-space:nowrap}
.status{font:400 17px var(--f-hand);color:var(--soft);text-align:center;margin:0;min-height:1.3em}
.status b{color:var(--sel);font-family:var(--f-body);font-size:14px}
/* ---------- tools ---------- */
.tools{display:flex;flex-direction:column;gap:8px;position:sticky;top:max(10px,env(safe-area-inset-top,0px))}
.tools h2{text-align:left;font-size:13px;color:var(--soft)}
.tb{border:3px solid var(--wall);background:var(--paper);border-radius:12px;box-shadow:0 3px 0 var(--wall);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;font:900 14px var(--f-body);text-transform:uppercase;letter-spacing:.02em;min-height:46px}
.tb small{font:600 10px/1.15 var(--f-body);text-transform:none;letter-spacing:0;color:var(--soft)}
.tb svg{width:26px;height:26px}
.tb[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 3px 0 #b58a16}
.tb:disabled{opacity:.4;cursor:default}
.tb:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--wall)}
.tb.big{min-height:62px}
.tb.hint{color:var(--ink)}
.tb.valid:not(:disabled){background:var(--cherry);border-color:var(--wall);color:#fff}
.tb.valid:not(:disabled) small{color:#ffe3e8}
.tb.erase{position:relative;overflow:hidden}
.tb.erase .fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(217,51,76,.25);pointer-events:none}
.tb.erase.holding .fill{width:100%;transition:width .9s linear}
.spacer{flex:1;min-height:40px}
.rules{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.rules h3{font:900 16px var(--f-display);margin:0 0 6px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--cherry)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px;margin-top:10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend img{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.legend .walk{color:#2f7a4a;font-weight:900}
.legend .nowalk{color:var(--cherry);font-weight:900}
/* ---------- phone / tablet ---------- */
@media (max-width:980px){
  .game{grid-template-columns:minmax(0,1fr)}
  .center{order:1}.tools{order:2;position:static;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tools h2,.tools .spacer,.tools .howto{display:none}
  .tb{min-height:54px;padding:6px 2px;font-size:11.5px}.tb small{display:none}.tb svg{width:22px;height:22px}.tb.big{min-height:54px}
  .suspects{order:3}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
  .clue{min-height:0;font-size:12.5px;padding:10px 6px 6px}
  .polaroid{width:72%}.polaroid .nm{font-size:16px}
}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.polaroid{width:52%}.brand{gap:4px}}
/* ---------- toast & reveal ---------- */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;z-index:30;background:var(--ink);color:var(--page);font:700 14px var(--f-body);padding:10px 16px;border-radius:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.reveal{position:fixed;inset:0;z-index:40;background:rgba(42,24,48,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reveal .box{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:22px 20px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .35s ease-out}
.reveal .eyebrow{font:400 20px var(--f-hand);color:var(--soft)}
.reveal h2{font:900 32px/1.05 var(--f-display);margin:6px 0;color:var(--cherry)}
.reveal .big{width:120px;height:120px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px var(--wall)}
.reveal .big svg{width:100%;height:100%;display:block}
.reveal p{margin:8px 0 14px}
.reveal .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{border:2px solid var(--ink);background:var(--paper);border-radius:999px;font:800 14px var(--f-display);padding:7px 14px;cursor:pointer}
.pill.red{background:var(--cherry);border-color:var(--cherry);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pimg{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 0%}
.who .ph .pimg{transform:scale(1.12);transform-origin:50% 25%}
.reveal .big{position:relative;overflow:visible}
.reveal .big .pimg{border-radius:22px}
.knife{position:absolute;right:-34%;bottom:-4%;width:44%;height:44%;transform:rotate(18deg)}
.obj .med{display:none}
.obj{align-items:flex-end;padding-bottom:6%}
.obj .gs{position:absolute;bottom:8%;left:18%;right:18%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(20,8,24,.55),rgba(20,8,24,0) 70%)}
.obj img{position:relative;max-width:84%;max-height:84%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(20,8,24,.5)) drop-shadow(0 6px 5px rgba(20,8,24,.35))}
.obj.o-book img,.obj.o-potion img{max-width:58%;max-height:58%}
.obj.o-bath img,.obj.o-desk img,.obj.o-trunk img{max-width:92%}
.mapimg{filter:saturate(.62) brightness(.8) contrast(.92)}
.cell{box-shadow:inset 0 0 0 .6px rgba(255,244,220,.28)}
#grid{filter:drop-shadow(0 10px 14px rgba(40,20,20,.28))}
.walls{position:absolute;left:calc(3.2% - 93.6% * 20 / var(--wn));top:calc(3.2% - 93.6% * 20 / var(--wn));width:calc(93.6% * (1 + 40 / var(--wn)));height:calc(93.6% * (1 + 40 / var(--wn)));pointer-events:none;z-index:2;overflow:visible;filter:drop-shadow(0 3px 0 rgba(93,63,82,.9))}
.walls .w{stroke:#2a1824;stroke-linecap:square;fill:none}
.walls .post{fill:#2a1824}
.mapimg{display:none}
.board{padding:18px 0 0 14px}
.cell .obj{position:absolute;inset:0;display:flex;padding:2%;align-items:center;justify-content:center;pointer-events:none}
.cell .obj.at-t{align-items:flex-start}.cell .obj.at-b{align-items:flex-end}.cell .obj.at-l{justify-content:flex-start}.cell .obj.at-r{justify-content:flex-end}
.cell .obj .spr{position:relative;width:90%;height:90%;display:flex;align-items:flex-end;justify-content:center}
.cell .obj.at-t .spr{align-items:flex-start}
.cell .obj .spr img{position:relative;z-index:1;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(20,8,24,.45))}
.cell .obj .spr::before{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,8,24,.5),rgba(20,8,24,0) 70%)}
.cell .obj.at-t .spr::before{bottom:auto;top:62%}
.cell .obj.o-book .spr{width:58%;height:58%;align-items:center}
.cell .obj.o-potion .spr{width:46%;height:52%}
.cell .obj.o-potion.center .spr::after{content:"";position:absolute;left:4%;right:4%;bottom:-10%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#d8d2cc 0 45%,#9d948e 60%,rgba(0,0,0,0) 72%)}
.cell .obj.o-shelf .spr,.cell .obj.o-desk .spr{width:98%;height:88%}
.cell .obj.o-bath .spr{width:98%;height:86%}
.cell .obj.o-mirror .spr{width:62%;height:86%}
.cell .obj.o-plant .spr,.cell .obj.o-candle .spr{width:80%;height:90%}
.cell .obj.flip img{transform:scaleX(-1)}
.rugs{position:absolute;inset:3.2%;width:93.6%;height:93.6%;pointer-events:none;z-index:1}
.objs{pointer-events:none;z-index:1}
.oc{position:relative;min-width:0;min-height:0}
.cell .obj,.oc .obj{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.oc .obj.at-t{align-items:flex-start}.oc .obj.at-b{align-items:flex-end}.oc .obj.at-l{justify-content:flex-start}.oc .obj.at-r{justify-content:flex-end}
.oc .obj .spr{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.oc .obj.at-t .spr{align-items:flex-start}
.oc .obj .spr img{position:relative;z-index:1;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(20,8,24,.45))}
.oc .obj .spr::before{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,8,24,.5),rgba(20,8,24,0) 70%)}
.oc .obj.at-t .spr::before{bottom:auto;top:62%}
.oc .obj.o-book .spr{width:62%;height:62%;align-items:center}
.oc .obj.o-potion .spr{width:52%;height:58%}
.oc .obj.o-potion.center .spr::after{content:"";position:absolute;left:4%;right:4%;bottom:-10%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#d8d2cc 0 45%,#9d948e 60%,rgba(0,0,0,0) 72%)}
.oc .obj.o-mirror .spr{width:70%}
.oc .obj.o-plant .spr,.oc .obj.o-candle .spr{width:88%}
.oc .obj.flip img{transform:scaleX(-1)}
.walls{z-index:2}.marks{z-index:3}
.xm{inset:22%!important}
.xm svg{filter:drop-shadow(0 1.5px 0 rgba(42,24,48,.25))!important}
.xm .x1{stroke:#b8283e}
.xm.auto .x1{stroke:#5d4a66}
.xm.auto{opacity:.5!important;inset:28%!important}
.xm.preview{opacity:.45!important}
@keyframes xin{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.xm:not(.auto):not(.preview){animation:xin .18s ease-out}
.views{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:4px}
.seg2{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg2 button{border:0;background:transparent;font:800 13px var(--f-display);padding:6px 13px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.skbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== Magicoku : nuit étoilée, parchemin, encre et or ===== */
:root{
  --night:#1a1330; --night2:#251b42; --parch:#f4e7c8; --parch2:#e9d6ad; --parch-edge:#b8935a;
  --ink:#2b1a33; --soft:#7c6a5a; --gold:#d6ab4f; --gold-soft:#f6e3a8; --gold-deep:#9a7426; --moon:#f3e9cf; --mist:#b9acd6;
  --paper:var(--parch); --line:#d8c39a; --cherry:#a3263b; --cherry-soft:#f3d9cf; --sel:#5b4fc4; --sel-soft:#ddd8ff;
  --f-display:"Cinzel Decorative","Cinzel",Georgia,serif; --f-title:"Cinzel",Georgia,serif;
  --f-body:"EB Garamond",Georgia,"Times New Roman",serif; --f-hand:"Caveat","Gochi Hand",cursive; --f-label:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
body{background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 9%,#fffa 50%,transparent 51%),
  radial-gradient(1px 1px at 44% 32%,#fff6 50%,transparent 51%),radial-gradient(1.2px 1.2px at 91% 41%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 6% 63%,#fff6 50%,transparent 51%),radial-gradient(1.4px 1.4px at 63% 77%,#fff7 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 88%,#fff5 50%,transparent 51%),radial-gradient(ellipse 60% 40% at 85% -5%,rgba(246,227,168,.18),transparent 70%),
  linear-gradient(180deg,var(--night2),var(--night) 60%)!important;background-attachment:fixed!important;color:var(--moon);font-family:var(--f-body);font-size:16px}
h1{font:900 clamp(30px,4.6vw,46px)/1 var(--f-display)!important;color:var(--gold-soft)!important;letter-spacing:.02em;text-shadow:0 2px 0 #0008,0 0 22px rgba(214,171,79,.35)}
h1 .drop{color:var(--gold)!important}
h1::before{content:"☾ ";color:var(--gold);font-size:.7em;vertical-align:.12em}
.case-title{color:var(--mist)!important;font:italic 500 16px var(--f-body)!important}
.story{color:var(--moon)!important;font:italic 17px/1.45 var(--f-body);max-width:80ch}
.story b{color:var(--gold-soft)!important}
.tab,.lang,.seg2{background:rgba(255,255,255,.04)!important;border:1.5px solid var(--gold)!important;color:var(--gold-soft)!important}
.tab{font:700 13px var(--f-title)!important;letter-spacing:.03em}
.tab small{color:var(--mist)!important;font-family:var(--f-body)!important}
.tab[aria-selected="true"],.lang button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:linear-gradient(var(--gold-soft),var(--gold))!important;color:#2b1a10!important}
.tab[aria-selected="true"] small{color:#5a3f15!important}
.lang button,.seg2 button{color:var(--gold-soft)!important;font-family:var(--f-title)!important}
.tab .ok{color:var(--gold)!important}
.suspects h2,.tools h2{font:700 16px var(--f-title)!important;color:var(--gold-soft)!important;letter-spacing:.06em;text-transform:uppercase}
.suspects .help{color:var(--mist)!important;font-style:italic}
.status{color:var(--mist)!important;font-family:var(--f-hand)!important;font-size:21px!important}
.status b{color:var(--gold-soft)!important}
.edge{color:var(--mist)!important;font-family:var(--f-title)!important}
/* suspect cards = portraits encadrés + parchemin */
.polaroid{background:linear-gradient(#e7c873,#b88a35)!important;border:2px solid #5d421a!important;border-radius:50% 50% 8px 8px/36% 36% 8px 8px!important;box-shadow:0 3px 0 #3b2a10,0 6px 14px #0007!important;padding:6px 6px 0!important}

.clue{background:linear-gradient(var(--parch),var(--parch2))!important;border:1.5px solid var(--parch-edge)!important;color:var(--ink)!important;box-shadow:0 3px 0 #0005!important;border-radius:6px!important;font:16px/1.3 var(--f-body)!important}
.card.victim .clue{background:linear-gradient(#f1dccd,#e1bfae)!important}
.card .vt{color:var(--cherry)!important;font-family:var(--f-title)!important}
.card[aria-pressed="true"] .polaroid{box-shadow:0 0 0 3px var(--gold-soft),0 0 18px var(--gold),0 3px 0 #3b2a10!important}
.card[aria-pressed="true"] .clue{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold),0 3px 0 #0005!important}
.card[aria-pressed="true"] .polaroid .nm{color:#2b1a10!important}
/* outils = boutons de grimoire */
.tb{background:linear-gradient(var(--parch),var(--parch2))!important;border:2px solid var(--gold-deep)!important;box-shadow:0 3px 0 #3b2a10,inset 0 0 0 2px #fff6!important;color:var(--ink)!important;font:700 13px var(--f-title)!important;border-radius:10px!important}

/* plan */
.plan{filter:drop-shadow(0 0 30px rgba(214,171,79,.18))}

.rules h3{font-family:var(--f-title)!important;color:var(--cherry)!important}
.legend{color:var(--ink)!important}
.toast{background:linear-gradient(var(--parch),var(--parch2))!important;color:var(--ink)!important;border:1.5px solid var(--gold-deep);font-family:var(--f-body)!important;font-size:16px!important;box-shadow:0 8px 24px #000a}
.reveal{background:rgba(10,6,24,.75)!important}

.pill{background:var(--parch)!important;border-color:var(--gold-deep)!important;color:var(--ink)!important;font-family:var(--f-title)!important}
.pill.red{background:linear-gradient(#b8344a,#7d1a2c)!important;color:#fbe9c9!important}
.board{background:radial-gradient(ellipse at 30% 20%,#f8eed5,transparent 60%),linear-gradient(var(--parch),var(--parch2));border-radius:10px;padding:26px 12px 12px 26px!important;box-shadow:0 0 0 2px var(--gold-deep),0 0 0 6px rgba(214,171,79,.18),0 18px 40px #000a}

.plan{filter:none}
.views{margin-bottom:10px}

/* header buttons */
.hbtn{border:1.5px solid var(--gold);background:rgba(255,255,255,.04);color:var(--gold-soft);border-radius:999px;padding:5px 12px;font:700 13px var(--f-title);cursor:pointer}

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

  radial-gradient(1px 1px at 12% 18%,#fff9 50%,transparent 51%),radial-gradient(1.6px 1.6px at 78% 9%,#fffb 50%,transparent 51%),radial-gradient(1px 1px at 44% 32%,#fff7 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 91% 41%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 6% 63%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 63% 77%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 88%,#fff6 50%,transparent 51%),radial-gradient(1.3px 1.3px at 35% 8%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 85% 70%,#fff7 50%,transparent 51%),

  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.tile b{font:900 clamp(16px,4.5vw,22px)/1 var(--f-display)}
.tile i{font:600 10px var(--f-body);font-style:normal;opacity:.9}
.tile.done{background:radial-gradient(circle at 35% 30%,#fff9,transparent 60%),linear-gradient(var(--gold-soft),var(--gold));color:#3b2a10}
.tile.done::after{content:"✓";position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:#2f7a4a;color:#fff;font:700 11px/18px var(--f-body)}
.tile.lockd{background:#bfb3a0;color:#6d6252;border-color:#9c8f7a;box-shadow:0 3px 0 #7d715f;cursor:not-allowed}
.tile.next{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 #2a1d4d,0 0 0 5px rgba(214,171,79,.45)}}
.lvinfo{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px;flex-wrap:wrap}
.lvinfo b{font:700 18px var(--f-title);display:block}
.lvinfo small{color:var(--soft)}
.lvinfo .hb.big{font-size:17px;padding:11px 18px}
.rank-list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;margin:0;padding:0;list-style:none}
.rank-row{display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--parch-edge);background:#fff7;border-radius:10px;padding:6px 10px}
.rank-row.me{border-color:var(--cherry);background:#fffb;box-shadow:0 0 0 2px var(--gold-soft)}
.rank-row .pos{font:900 17px var(--f-display);color:var(--gold-deep);text-align:center}
.rank-row img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#e9d6ad;display:block}
.rank-row b{font:700 16px var(--f-title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .sc{text-align:right;font-size:14px;line-height:1.25;white-space:nowrap}
.rank-row .sc strong{font:700 15px var(--f-title);color:var(--cherry);display:block}
.rank-msg{margin:0;text-align:center;font-style:italic;color:var(--soft)}

.legacy{border:1.5px dashed var(--gold-deep);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#fff5}
.legacy p{margin:0;font-size:15px}
.lglist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.lgrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--parch-edge);background:#fff9;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.lgrow img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#e9d6ad}
.lgrow b{font:700 15px var(--f-title)}
.lgrow small{color:var(--soft)}
#tabs{display:none!important}

/* ---------- state ---------- */
let tool=null; // null | "x" | "erase"
const key=()=>"crimes-mignons-wiz:"+C.id;
function fresh(){return {sel:null,place:{},notes:{},xs:{},auto:{},hints:0,solved:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(key())||"null");if(s&&s.place){s.auto={};return s}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}}
function snap(){hist.push(JSON.stringify({place:S.place,notes:S.notes,xs:S.xs,auto:S.auto}));if(hist.length>400)hist.shift()}
function whoAt(r,c){for(const p in S.place){const [a,b]=S.place[p];if(a===r&&b===c)return +p}return null}
const ini=p=>pname(p).replace(/^(Pr|Sir|Maître|Dr|Dame) /,"")[0];
function inkCol(p){const h=look(p)[4].slice(1);let r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0;if(mx!==mn){const d=mx-mn;H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}
  return `hsl(${Math.round(H)} 70% 36%)`}
/* ---------- clue text ---------- */
function clueText(p,[k,v]){
  const Nm=`<b>${pname(p)}</b>`,Q=typeof v==="number"?pname(v):"";
  const o=OBJN[v]?OBJN[v][LI()]:"";
  if(LANG==="en")switch(k){
    case "room":return `${Nm} was in ${rname(v)}.`;case "notroom":return `${Nm} was not in ${rname(v)}.`;
    case "row":return `${Nm} was in row ${ROWS[v]}.`;case "col":return `${Nm} was in column ${v+1}.`;
    case "on":return `${Nm} was ${ONTXT[v][1]}.`;
    case "adj":return `${Nm} was next to ${o}.`;case "same":return `${Nm} was in the same room as ${Q}.`;
    case "south":return `${Nm} was further south than ${Q}.`;case "north":return `${Nm} was further north than ${Q}.`;
    case "east":return `${Nm} was further east than ${Q}.`;case "west":return `${Nm} was further west than ${Q}.`;
    case "alone":return `${Nm} was alone in ${fem(p,"his","her")} room.`;}
  switch(k){
    case "room":return `${Nm} était dans ${rname(v)}.`;case "notroom":return `${Nm} n'était pas dans ${rname(v)}.`;
    case "row":return `${Nm} était sur la rangée ${ROWS[v]}.`;case "col":return `${Nm} était sur la colonne ${v+1}.`;
    case "on":return `${Nm} était ${ONTXT[v][0][fem(p,0,1)]}.`;
    case "adj":return `${Nm} était à côté ${o.startsWith("le ")?"du "+o.slice(3):o.startsWith("la ")?"de la "+o.slice(3):"d'"+o}.`;
    case "same":return `${Nm} était dans la même pièce que ${Q}.`;
    case "south":return `${Nm} était plus au sud que ${Q}.`;case "north":return `${Nm} était plus au nord que ${Q}.`;
    case "east":return `${Nm} était plus à l'est que ${Q}.`;case "west":return `${Nm} était plus à l'ouest que ${Q}.`;
    case "alone":return `${Nm} était ${fem(p,"seul","seule")} dans sa pièce.`;}
}

/* ---------- placing ---------- */
function removePerson(p){
  delete S.place[p];
  for(const k in S.auto){S.auto[k]=S.auto[k].filter(x=>x!==p);if(!S.auto[k].length)delete S.auto[k]}
}
function placePerson(p,r,c){
  const w=whoAt(r,c);if(w!=null)removePerson(w);
  if(S.place[p])removePerson(p);
  S.place[p]=[r,c];delete S.xs[r+","+c];
  for(const k in S.notes){S.notes[k]=S.notes[k].filter(x=>x!==p);if(!S.notes[k].length)delete S.notes[k]}
}
function eraseCell(r,c){const k=r+","+c,w=whoAt(r,c);let ch=false;
  if(w!=null){removePerson(w);ch=true}if(S.xs[k]){delete S.xs[k];ch=true}if(S.notes[k]){delete S.notes[k];ch=true}if(S.auto[k]){delete S.auto[k];ch=true}return ch}

const STAR="url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Cpath d=%27M10 2l1.6 6.4L18 10l-6.4 1.6L10 18l-1.6-6.4L2 10l6.4-1.6z%27 fill=%27%23000%27 fill-opacity=%27.13%27/%3E%3C/svg%3E')";
const PP=f=>(3.2+f*93.6).toFixed(3)+"%";
const isVoid=(r,c)=>r<0||c<0||r>=N||c>=N||C.rooms[r][c]===".";
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`}
function floorCSS(k,r,c,pi){
  const [f1,f2]=(M.floors||FLOORS)[k]||["#ccc","#ddd"],d=shade(f1,.82),l=shade(f1,1.1);
  switch(pi%4){
    case 0:return `${STAR} center/34% no-repeat,${(r+c)%2?f2:f1}`;
    case 1:return `repeating-linear-gradient(90deg,${f1} 0 31%,${d} 31% 33.33%),${f1}`; // planks
    case 2:return `${STAR} center/26% no-repeat,conic-gradient(from 45deg at 50% 50%,${f2} 25%,${f1} 0 50%,${f2} 0 75%,${f1} 0) 0 0/100% 100%`; // diamonds
    default:return `conic-gradient(${f1} 25%,${l} 0 50%,${f1} 0 75%,${l} 0) 0 0/50% 50%`; // small checker
  }
}
const CORNER_T=new Set(["plant","cauldron","trunk","bath","gramo","candle","chair"]),WALL_T=new Set(["shelf","mirror","desk"]);
function sprHTML(o,r,c){
  const k=room(r,c),w=(rr,cc)=>isVoid(rr,cc)||room(rr,cc)!==k;
  const T=w(r-1,c),B=w(r+1,c),Lf=w(r,c-1),R=w(r,c+1);let at=[];
  if(CORNER_T.has(o)){
    if(T&&Lf)at=["t","l"];else if(T&&R)at=["t","r"];else if(B&&Lf)at=["b","l"];else if(B&&R)at=["b","r"];
    else if(T)at=["t"];else if(Lf)at=["l"];else if(R)at=["r"];else if(B)at=["b"];
  }else if(WALL_T.has(o)){
    if(T)at=["t"];else if(Lf)at=["l"];else if(R)at=["r"];else if(B)at=["b"];
  }
  const cls=at.length?at.map(x=>"at-"+x).join(" "):"center";
  const half=v=>(v?(isVoid(...v)?15:10)*N/9+3:4).toFixed(1)+"%";
  const pad=`padding:${half(T&&[r-1,c])} ${half(R&&[r,c+1])} ${half(B&&[r+1,c])} ${half(Lf&&[r,c-1])}`;
  const flip=o==="chair"&&at.includes("r")&&!at.includes("t")?" flip":"";
  return `<span class="obj o-${o} ${cls}${flip}" style="${pad}"><span class="spr"><img src="${SPR[o]}" alt="" draggable="false"></span></span>`;
}
function renderBoard(){
  const rooms=[...new Set(C.rooms.join(""))].filter(k=>k!==".");const pidx={};rooms.forEach((k,i)=>pidx[k]=(M.patterns&&M.patterns[k]!=null)?M.patterns[k]:i);

function unaryOk([k,v],r,c){
  if(k==="room")return room(r,c)===v;if(k==="notroom")return room(r,c)!==v;if(k==="on")return OBJ[r][c]===v;
  if(k==="adj")return adjTypes(r,c).has(v);if(k==="row")return r===v;if(k==="col")return c===v;return true}
function deduce(){
  const P=M.people.length,cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!blocked(r,c))cells.push([r,c]);
  const rm=x=>room(x[0],x[1]);
  let cand=M.people.map((_,p)=>S.place[p]?[S.place[p]]:cells.filter(([r,c])=>(C.clues[p]||[]).every(cl=>unaryOk(cl,r,c))));
  const placedNow=new Set(Object.keys(S.place).map(Number));
  for(let it=0;it<60;it++){
    let ch=false;const set=(p,n)=>{if(n.length!==cand[p].length){cand[p]=n;ch=true}};
    for(let p=0;p<P;p++)if(cand[p].length===1){const [r,c]=cand[p][0];for(let q=0;q<P;q++)if(q!==p)set(q,cand[q].filter(x=>x[0]!==r&&x[1]!==c))}
    for(let p=0;p<P;p++)for(const [k,v] of (C.clues[p]||[])){
      if(k==="same"){const rq=new Set(cand[v].map(rm));set(p,cand[p].filter(x=>rq.has(rm(x))));const rp=new Set(cand[p].map(rm));set(v,cand[v].filter(x=>rp.has(rm(x))))}
      if(["south","north","east","west"].includes(k)){const i=k==="south"||k==="north"?0:1;
        if(k==="south"||k==="east"){const lo=Math.min(...cand[v].map(x=>x[i]));set(p,cand[p].filter(x=>x[i]>lo));const hi=Math.max(...cand[p].map(x=>x[i]));set(v,cand[v].filter(x=>x[i]<hi))}
        else{const hi=Math.max(...cand[v].map(x=>x[i]));set(p,cand[p].filter(x=>x[i]<hi));const lo=Math.min(...cand[p].map(x=>x[i]));set(v,cand[v].filter(x=>x[i]>lo))}}
      if(k==="alone"){for(let q=0;q<P;q++)if(q!==p&&cand[q].length===1){const R=rm(cand[q][0]);set(p,cand[p].filter(x=>rm(x)!==R))}
        if(cand[p].length===1){const R=rm(cand[p][0]);for(let q=0;q<P;q++)if(q!==p)set(q,cand[q].filter(x=>rm(x)!==R))}}
    }
    if(!ch){for(const i of [0,1])for(let j=0;j<N;j++){const ps=[...Array(P).keys()].filter(p=>cand[p].some(x=>x[i]===j));if(ps.length===1)set(ps[0],cand[ps[0]].filter(x=>x[i]===j))}
      if(cand[0].length===1){const R=rm(cand[0][0]);const inR=[...Array(P).keys()].filter(q=>q>0&&cand[q].length===1&&rm(cand[q][0])===R);
        if(inR.length)for(let q=1;q<P;q++){if(!inR.includes(q))set(q,cand[q].filter(x=>rm(x)!==R))}
        else{const can=[...Array(P).keys()].filter(q=>q>0&&cand[q].some(x=>rm(x)===R));if(can.length===1)set(can[0],cand[can[0]].filter(x=>rm(x)===R))}}}
    const found=[...Array(P).keys()].find(p=>!placedNow.has(p)&&cand[p].length===1);
    if(found!=null)return {p:found,cell:cand[found][0]};
    if(!ch)break;
  }
  return null;
}

/* ================= MENU FX: particles ================= */
(function(){
  const home=$("#home");const cv=document.createElement("canvas");cv.className="home-fx";home.prepend(cv);
  const ctx=cv.getContext("2d");let W=0,H=0,D=1,parts=[],stars=[],shoots=[],trail=[],t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){D=Math.min(2,devicePixelRatio||1);W=home.clientWidth;H=home.clientHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+"px";cv.style.height=H+"px";
    stars=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.6+Math.random()*1.6}));
    parts=Array.from({length:Math.round(W*H/16000)+12},()=>newP(true))}
  function newP(any){return {x:Math.random()*W,y:any?Math.random()*H:H+10,r:Math.random()*2.2+.8,vy:-(.15+Math.random()*.45),vx:(Math.random()-.5)*.25,ph:Math.random()*6.28,
    hue:Math.random()<.75?"246,215,130":(Math.random()<.5?"200,180,255":"255,200,220"),life:1}}
  window.addEventListener("resize",size);
  home.addEventListener("pointermove",e=>{if(reduce)return;const r=home.getBoundingClientRect();for(let i=0;i<2;i++)trail.push({x:e.clientX-r.left,y:e.clientY-r.top,vx:(Math.random()-.5)*.8,vy:(Math.random()-.2)*.8,a:1,r:Math.random()*2+1})});
  function star4(x,y,s,a,col){ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;ctx.fillStyle=`rgb(${col})`;ctx.beginPath();
    for(let i=0;i<8;i++){const ang=i*Math.PI/4,rr=i%2?s*.28:s;ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
  function frame(now){requestAnimationFrame(frame);if(home.hidden)return;if(cv.width!==Math.round(home.clientWidth*D))size();
    const t=(now-t0)/1000;ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);
    for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));ctx.globalAlpha=a*.9;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()}
    if(!reduce&&Math.random()<.004)shoots.push({x:Math.random()*W*.8,y:Math.random()*H*.35,vx:5+Math.random()*3,vy:2+Math.random()*1.5,l:1});
    for(const s of shoots){s.x+=s.vx;s.y+=s.vy;s.l-=.016;const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*14,s.y-s.vy*14);g.addColorStop(0,`rgba(255,245,210,${s.l})`);g.addColorStop(1,"rgba(255,245,210,0)");
      ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*14,s.y-s.vy*14);ctx.stroke()}
    shoots=shoots.filter(s=>s.l>0);
    for(const p of parts){if(!reduce){p.y+=p.vy;p.x+=p.vx+Math.sin(t+p.ph)*.2}const tw=.5+.5*Math.sin(t*2.2+p.ph);
      ctx.globalAlpha=.25+.55*tw;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(${p.hue},.9)`);g.addColorStop(1,`rgba(${p.hue},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,6.28);ctx.fill();
      if(p.r>2.4)star4(p.x,p.y,p.r*2.2,.5*tw,p.hue);
      if(p.y<-20){Object.assign(p,newP(false))}}
    for(const q of trail){q.x+=q.vx;q.y+=q.vy;q.vy+=.02;q.a-=.025;star4(q.x,q.y,q.r*2,Math.max(0,q.a),"255,225,150")}
    trail=trail.filter(q=>q.a>0).slice(-120);ctx.globalAlpha=1}
  size();requestAnimationFrame(frame);
})();

const MUS={on:true,timer:null,step:0,next:0,started:false};
try{MUS.on=localStorage.getItem("magicoku:music")!=="off"}catch(e){}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
// gentle waltz in A minor / F / C / G — music box melody + soft pads
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const MEL=[76,72,69,72, 74,72,69,65, 72,67,64,67, 71,74,79,74, 76,79,81,79, 77,74,72,69, 72,76,79,76, 74,71,67,71];
function pad(f,t0,dur,vol){const c=ac(),m=bus();if(!c||!m)return;const t=c.currentTime+t0;const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();
  o.type="sine";o2.type="triangle";o.frequency.value=f;o2.frequency.value=f*1.003;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.6);g.gain.linearRampToValueAtTime(vol*.7,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  const g2=c.createGain();g2.gain.value=.35;o.connect(g);o2.connect(g2).connect(g);g.connect(m);o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1)}
function musicTick(){const c=ac();if(!c||!MUS.on||$("#home").hidden||!SND.on){return}
  const beat=.42;while(MUS.next<c.currentTime+.6){const i=MUS.step,dt=Math.max(0,MUS.next-c.currentTime);
    const bar=Math.floor(i/4)%8;const ch=CHORDS[bar%4];
    if(i%4===0){ch.forEach(n=>pad(NOTE(n),dt,beat*4.2,.028));pad(NOTE(ch[0]-12),dt,beat*4.2,.03)}
    const mn=MEL[i%MEL.length];bell(NOTE(mn),dt,1.1,i%4===0?.07:.05);
    if(i%8===6)bell(NOTE(mn+12),dt+beat*.5,.8,.025);
    MUS.step++;MUS.next+=beat}}
function startMusic(){if(!MUS.on||!SND.on)return;const c=ac();if(!c)return;if(!MUS.timer){MUS.next=c.currentTime+.15;MUS.timer=setInterval(musicTick,120)}}
function stopMusic(){clearInterval(MUS.timer);MUS.timer=null}
document.addEventListener("pointerdown",()=>{if(!$("#home").hidden)startMusic()},true);
new MutationObserver(()=>{if($("#home").hidden)stopMusic();else if(SND.ctx)startMusic()}).observe($("#home"),{attributes:true,attributeFilter:["hidden"]});
function setMusic(on){MUS.on=on;try{localStorage.setItem("magicoku:music",on?"on":"off")}catch(e){}if(on)startMusic();else stopMusic();renderHome()}
